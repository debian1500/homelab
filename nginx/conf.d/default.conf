server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /services/nginx/website;
    index index.html;
    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }

    location /apk {
        return 301 /apk/;
    }

    location /apk/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        alias /mnt/media/apk/;
        types {
            application/vnd.android.package-archive apk;
        }
    }

    location /soft {
        return 301 /soft/;
    }

    location /soft/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        alias /mnt/media/soft/;
    }

    location /distr {
        return 301 /distr/;
    }

    location /distr/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;


        alias /mnt/media/distr/;

	location /distr/template/ { return 404; }
	location /distr/images/ { return 404; }
    }

    location /books {
        return 301 /books/;
    }

    location /books/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
 
        alias /mnt/media/books/;
    }
}
